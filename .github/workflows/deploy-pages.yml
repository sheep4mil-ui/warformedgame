name: Export and deploy Godot game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -r /root/.local/share/godot/export_templates/4.7.1.stable \
            "$HOME/.local/share/godot/export_templates/"

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html

      - name: Version browser assets
        run: |
          BUILD_ID=$(printf %.12s "$GITHUB_SHA")
          mv build/web/index.js "build/web/index-${BUILD_ID}.js"
          mv build/web/index.pck "build/web/index-${BUILD_ID}.pck"
          mv build/web/index.wasm "build/web/index-${BUILD_ID}.wasm"
          sed -i \
            -e "s/index\\.js/index-${BUILD_ID}.js/g" \
            -e "s/\"executable\":\"index\"/\"executable\":\"index-${BUILD_ID}\"/g" \
            -e "s/\"index\\.pck\"/\"index-${BUILD_ID}.pck\"/g" \
            -e "s/\"index\\.wasm\"/\"index-${BUILD_ID}.wasm\"/g" \
            build/web/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
